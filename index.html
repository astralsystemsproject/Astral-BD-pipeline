<style>
:root{
  color-scheme: light;
  /* Astral palette, taken from the logo */
  --ink:#1A2B1F; --ink-2:#56645B; --ink-3:#86938B;
  --blue:#3B7CF6; --blue-deep:#2558C9; --sky:#6E9BF0; --wash:#EAF1FE;
  --side:#13221A; --side-2:#1B2E23; --side-ink:#C5D0C9; --side-mute:#7F9187;
  --bg:#EEF2F7; --card:#FFFFFF; --line:#E1E6EE; --line-2:#EEF1F5;
  --alert:#C4321F; --alert-wash:#FDECEA; --ok:#23794A; --ok-wash:#E6F4EC; --amber:#B45F06; --amber-wash:#FDF1E1;
  --card-2:#F8FAFC; --hover:#F5F8FD; --fill:#F1F4F8; --col:#E7ECF2; --input:#FFFFFF; --line-strong:#CBD3DC;
  --blue-ink:#2558C9; --violet:#4B4FC4; --violet-wash:#EEF0FD; --wash-line:#CFDDFB; --alert-line:#F3C9C3;
  --glass:rgba(255,255,255,.82); --toast-bg:#1A2B1F; --toast-ink:#FFFFFF;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(19,34,26,.04),0 8px 24px rgba(19,34,26,.05);
  --shadow-lift:0 14px 34px rgba(19,34,26,.10);
  --sw:248px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-feature-settings:'cv11','ss01';
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#E7EEEA; --ink-2:#A3B2A9; --ink-3:#74867B;
  --blue-ink:#8DB3FA; --sky:#6E9BF0; --wash:rgba(59,124,246,.16); --wash-line:rgba(110,155,240,.3);
  --side:#0B140F; --side-2:#15231B;
  --bg:#0E1813; --card:#131F18; --card-2:#17251D; --hover:#1A2A21; --fill:#1C2C23; --col:#101A14; --input:#0F1913;
  --line:#24352B; --line-2:#1C2B23; --line-strong:#35493D;
  --alert:#F0826E; --alert-wash:rgba(196,50,31,.2); --alert-line:rgba(240,130,110,.35);
  --ok:#5FD08F; --ok-wash:rgba(35,121,74,.24);
  --violet:#AEB1F7; --violet-wash:rgba(99,102,241,.2);
  --glass:rgba(14,24,19,.78); --toast-bg:#E7EEEA; --toast-ink:#0E1813;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.22);
  --shadow-lift:0 14px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .18s ease;background:linear-gradient(90deg,var(--side) 0 var(--sw),transparent 0)}
.app.collapsed{--sw:76px}

.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto;overflow-x:hidden;z-index:40;
  background-image:radial-gradient(120% 60% at 0% 0%,rgba(59,124,246,.16),transparent 60%)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 18px}
.logo-full{height:40px;width:auto;display:block}
.logo-mark{height:36px;width:36px;display:none}
.collapse{border:0;background:transparent;color:var(--side-mute);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.collapse:hover{background:rgba(255,255,255,.08);color:#fff}
.sect{font-size:12px;font-weight:600;color:var(--side-mute);padding:16px 12px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:inherit;text-decoration:none;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(59,124,246,.30),rgba(59,124,246,.10));color:#fff;box-shadow:inset 3px 0 0 var(--blue),inset 0 0 0 1px rgba(110,155,240,.14)}
.nav a[aria-current="page"] svg{color:#8DB3FA}
.nbadge{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--alert);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.nbadge.soft{background:rgba(255,255,255,.12);color:#E4EAE6}
.side-foot{margin-top:auto;padding:14px 6px 0}
.status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--side-2);font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden}
.status i{width:8px;height:8px;border-radius:50%;background:var(--sky);flex:none;box-shadow:0 0 0 4px rgba(110,155,240,.18)}
.status.live i{background:#3CC37A;box-shadow:0 0 0 4px rgba(60,195,122,.18)}
.status b{display:block;color:#fff;font-weight:600}

.app.collapsed .t,.app.collapsed .sect,.app.collapsed .logo-full,.app.collapsed .status .t{display:none}
.app.collapsed .logo-mark{display:block}
.app.collapsed .side-top{flex-direction:column;gap:12px}
.app.collapsed .nav a,.app.collapsed .nav button{justify-content:center;padding:11px}
.app.collapsed .nbadge{position:absolute;top:3px;right:6px;min-width:18px;height:17px;padding:0 5px;font-size:10.5px}
.app.collapsed .status{justify-content:center;padding:12px}
.app.collapsed .collapse svg{transform:rotate(180deg)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:66px;display:flex;align-items:center;gap:14px;padding:0 28px;background:var(--glass);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;white-space:nowrap}
.iconbtn.menu-btn{display:none}
.tsearch{position:relative;margin-left:auto;width:min(380px,34vw)}
.tsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.tsearch input{width:100%;height:40px;border:1px solid transparent;border-radius:10px;background:var(--fill);padding:0 12px 0 38px;transition:border-color .12s,background .12s,box-shadow .12s}
.tsearch input:focus{outline:none;background:var(--input);border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,124,246,.15)}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}

.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;line-height:1.2;min-height:38px;transition:background .12s,border-color .12s,box-shadow .12s}
.btn svg{width:18px;height:18px}
.btn:hover{background:var(--hover);border-color:var(--line-strong)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(59,124,246,.35)}
.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.btn.danger{color:var(--alert);border-color:var(--alert-line)}
.btn.danger:hover{background:var(--alert-wash)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.onDark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.btn.onDark:hover{background:rgba(255,255,255,.18)}

.user{position:relative}
.user summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:999px;padding:2px}
.user summary::-webkit-details-marker{display:none}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3B7CF6,#1F4FB8);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line)}
.menu{position:absolute;right:0;top:calc(100% + 10px);z-index:50;min-width:250px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(19,34,26,.16)}
.menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.menu .who b{display:block}
.menu .who span{font-size:12.5px;color:var(--ink-2)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer}
.menu button svg{width:18px;height:18px;color:var(--ink-2)}
.menu button:hover{background:var(--wash)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:6px 0}
.menu .out{color:var(--alert)}
.menu .out svg{color:var(--alert)}

.content{padding:24px 28px 64px;width:100%;max-width:1440px;margin:0 auto}
.banner{margin-bottom:18px;padding:11px 14px;background:var(--wash);color:var(--blue-ink);border:1px solid var(--wash-line);border-radius:12px;font-size:13px}
.banner.warn{background:var(--alert-wash);color:var(--alert);border-color:var(--alert-line)}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;color:#E9EFEB;background:var(--side);
  background-image:radial-gradient(90% 140% at 100% 0%,rgba(59,124,246,.45),transparent 55%),radial-gradient(60% 120% at 0% 100%,rgba(110,155,240,.14),transparent 60%);
  display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.hero h2{font-size:26px;color:#fff;letter-spacing:-.02em}
.hero p{margin:6px 0 0;color:#B9C6BF;max-width:56ch}
.hero p b{color:#fff}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.orbit{position:absolute;right:-110px;bottom:-95px;width:300px;height:200px;opacity:.5;pointer-events:none}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0}
.kpi{display:block;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift);border-color:var(--line-strong)}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kpi .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--wash);color:var(--blue-ink)}
.kpi .ic svg{width:20px;height:20px}
.kpi .num{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.kpi.k-due .ic{background:var(--violet-wash);color:var(--violet)}
.kpi.k-over .ic{background:var(--alert-wash);color:var(--alert)}
.kpi.k-over.hot .num{color:var(--alert)}
.kpi.k-won .ic{background:var(--ok-wash);color:var(--ok)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.panel.span2{grid-column:1/-1}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.ph h2{font-size:15px}
.ph .note{font-size:12.5px;color:var(--ink-2)}
.ph a,.linkbtn{border:0;background:none;padding:0;color:var(--blue-ink);font-weight:600;font-size:13px;text-decoration:none;cursor:pointer}
.ph a:hover,.linkbtn:hover{text-decoration:underline}
.pb{padding:18px 20px;flex:1}
.pb.flush{padding:0}
.pempty{padding:28px 20px;text-align:center;color:var(--ink-2)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:14px;align-items:center}
.ftrack{display:flex;justify-content:center}
.fbar{height:30px;border-radius:7px;background:var(--blue);min-width:4px;transition:width .3s ease}
.fbar.zero{background:var(--line);width:10px!important;height:10px;border-radius:50%}
.flab{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.flab b{color:var(--ink);font-variant-numeric:tabular-nums}
.ffoot{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.ffoot b{color:var(--ink)}

/* activity */
.feed{list-style:none;margin:0;padding:6px 20px 14px}
.feed li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.feed li:last-child{border-bottom:0}
.feed .av{width:34px;height:34px;border-radius:50%;background:var(--wash);color:var(--blue-ink);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.feed .txt{font-size:13.5px}
.feed .txt .co{font-size:12.5px;font-weight:600}
.feed .meta{font-size:12px;color:var(--ink-3)}
.feed .meta time{display:inline;font-size:inherit;color:inherit}
.feed time{display:block;font-size:12px;color:var(--ink-3)}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) 34px;gap:12px;align-items:center}
.brow .bl{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.brow .bl i{width:8px;height:8px;border-radius:50%;flex:none}
.track{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--blue);min-width:3px}
.brow .bv{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* weekly columns */
.cols{position:relative;display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:18px;border-bottom:1px solid var(--line)}
.cols .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.cols .grid span{position:absolute;right:0;top:-18px;font-size:11.5px;color:var(--ink-3)}
.ccol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:default;position:relative}
.cbar{width:100%;max-width:38px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.cbar.zero{background:var(--line)}
.cval{font-size:12px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.cx{display:flex;gap:8px;margin-top:8px}
.cx span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.tile .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.tile .num{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--ink-2)}

/* ---------- pipeline strip (orbit line) ---------- */
.beamcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 14px 14px;overflow-x:auto;margin-bottom:16px}
.beam{position:relative;display:grid;grid-template-columns:repeat(8,1fr);min-width:680px}
.beam::before{content:'';position:absolute;left:6.25%;right:6.25%;bottom:23px;height:4px;border-radius:2px;background:var(--sky)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 4px 0;border-radius:12px;cursor:pointer}
.stage:hover{background:var(--hover)}
.stage .n{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stage .l{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.stage .dot{position:relative;z-index:1;margin:10px 0 9px;width:18px;height:18px;border-radius:50%;background:var(--card);border:4px solid var(--sky)}
.stage.has .dot{background:var(--c);border-color:var(--c)}
.stage.zero .n{color:var(--ink-3)}
.stage[aria-pressed="true"]{background:var(--wash)}
.stage[aria-pressed="true"] .l{color:var(--blue-ink);font-weight:600}
.stage[aria-pressed="true"] .dot{box-shadow:0 0 0 5px rgba(59,124,246,.22)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .fsearch{position:relative;flex:1 1 240px;max-width:380px}
.toolbar .fsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.toolbar input[type=search],.toolbar select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px}
.toolbar input[type=search]{width:100%;padding-left:38px}
.toolbar .count{margin-left:auto;color:var(--ink-2);font-size:13px}

/* ---------- tables ---------- */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow)}
.pb.flush .tablewrap{border:0;border-radius:0 0 16px 16px;box-shadow:none}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:560px;table-layout:fixed}
td{overflow-wrap:anywhere}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:0;border-bottom:1px solid var(--line);background:var(--card-2);white-space:nowrap}
th .th{border:0;background:none;padding:11px 16px;width:100%;text-align:left;cursor:pointer;font-weight:600;color:inherit;display:block}
span.th{cursor:default!important}
th button.th:hover{color:var(--ink)}
th[aria-sort="ascending"] .th::after{content:' \2191';color:var(--blue)}
th[aria-sort="descending"] .th::after{content:' \2193';color:var(--blue)}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--hover)}
.co{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink)}
.co:hover{color:var(--blue-ink)}
.sub{font-size:12.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:3px 10px 3px 8px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:600;color:var(--ink)}
.pill i{width:8px;height:8px;border-radius:50%}
.fit{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.fit i{width:5px;background:var(--line);border-radius:2px}
.fit i:nth-child(1){height:6px}.fit i:nth-child(2){height:8px}.fit i:nth-child(3){height:10px}.fit i:nth-child(4){height:12px}.fit i:nth-child(5){height:14px}
.fit i.on{background:var(--blue)}
.due{margin-top:2px;font-size:12.5px;color:var(--ink-2)}
.due.overdue{color:var(--alert);font-weight:600}
.due.today{color:var(--blue-ink);font-weight:600}
.chip{white-space:nowrap;display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.chip.overdue{background:var(--alert-wash);color:var(--alert)}
.chip.today{background:var(--wash);color:var(--blue-ink)}
.chip.week{background:var(--violet-wash);color:var(--violet)}
.chip.later,.chip.none{background:var(--fill);color:var(--ink-2)}
.owner{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.owner i{width:24px;height:24px;border-radius:50%;background:var(--wash);color:var(--blue-ink);font-style:normal;font-weight:700;font-size:11px;display:inline-grid;place-items:center}

.grouphead{display:flex;align-items:center;gap:8px;margin:26px 0 10px}
.grouphead:first-child{margin-top:0}
.grouphead h2{font-size:15px}
.grouphead .c{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--col);color:var(--ink-2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.grouphead.overdue h2{color:var(--alert)}
.grouphead.overdue .c{background:var(--alert-wash);color:var(--alert)}
.grouphead.today .c{background:var(--wash);color:var(--blue-ink)}

.empty{background:var(--card);border:1px dashed var(--line-strong);border-radius:16px;padding:44px 24px;text-align:center}
.empty .mark{width:54px;height:54px;margin:0 auto 14px;display:block}
.empty h2{font-size:17px;margin-bottom:6px}
.empty p{margin:0 auto 18px;max-width:46ch;color:var(--ink-2)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--col);border:1px solid transparent;border-radius:14px;padding:10px;min-height:180px;transition:background .12s,border-color .12s}
.col.over{background:var(--wash);border-color:var(--sky)}
.col h3{font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:4px 4px 6px}
.col h3 .pill{background:transparent;padding:0;font-size:13.5px}
.col h3 .c{color:var(--ink-2);font-weight:700;font-size:12px;background:var(--card);border-radius:999px;padding:1px 9px}
.colbar{height:3px;border-radius:2px;background:var(--c);margin:0 4px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-top:9px;cursor:grab;box-shadow:0 1px 2px rgba(19,34,26,.05);transition:box-shadow .12s}
.card:hover{box-shadow:0 8px 20px rgba(19,34,26,.1)}
.card:active{cursor:grabbing}
.card .co{display:block;margin-bottom:2px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.card.dragging{opacity:.45}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(19,34,26,.38);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--card);z-index:61;transform:translateX(100%);visibility:hidden;transition:transform .2s cubic-bezier(.2,.7,.2,1),visibility 0s .2s;box-shadow:-16px 0 40px rgba(19,34,26,.18)}
.drawer.open{transform:none;visibility:visible;transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.drawer form{display:flex;flex-direction:column;height:100%}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:18px}
.dr-body{padding:18px 20px;overflow-y:auto;flex:1}
.dr-foot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--card-2)}
.grow{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.fgrid .span2{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
label input,label select,label textarea{border:1px solid var(--line);border-radius:10px;background:var(--input);padding:9px 11px;color:var(--ink);font-weight:400;font-size:14px;width:100%;transition:border-color .12s,box-shadow .12s}
label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,124,246,.18)}
label textarea{resize:vertical}
.doneWrap{display:flex;align-items:flex-end}
.drawer h3{font-size:14px;margin:24px 0 8px}
.activity{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line-2)}
.activity li{position:relative;padding:6px 0 10px}
.activity li::before{content:'';position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--sky)}
.activity time{display:block;font-size:12px;color:var(--ink-2)}

/* ---------- sign-in ---------- */
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:30px;width:min(400px,92vw);box-shadow:0 24px 60px rgba(19,34,26,.3)}
dialog::backdrop{background:rgba(19,34,26,.55);backdrop-filter:blur(3px)}
dialog .logo{height:40px;width:auto;max-width:100%;align-self:flex-start;object-fit:contain;margin-bottom:16px}
dialog h2{font-size:19px;margin-bottom:6px}
dialog p{margin:0 0 14px;color:var(--ink-2)}
dialog form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--alert);min-height:1.2em;margin:0!important}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:11px 18px;border-radius:12px;z-index:80;max-width:92vw;box-shadow:0 10px 30px rgba(19,34,26,.3)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--toast-bg);color:var(--toast-ink);font-size:12.5px;padding:7px 10px;border-radius:8px;box-shadow:0 8px 20px rgba(19,34,26,.25);white-space:nowrap}
.navscrim{display:none}
.only-sm{display:none}

@media (max-width:1180px){
  .kpis,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr);--sw:264px;background:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-100%);transition:transform .2s ease}
  .app.navopen .side{transform:none}
  .app.navopen .navscrim{display:block;position:fixed;inset:0;background:rgba(19,34,26,.4);z-index:35}
  .collapse{display:none}
  .app.collapsed .t,.app.collapsed .sect,.app.collapsed .logo-full{display:revert}
  .app.collapsed .logo-mark{display:none}
  .iconbtn.menu-btn{display:grid}
  .hide-sm{display:none}
  .only-sm{display:block}
}
@media (max-width:640px){
  .topbar{padding:0 14px;gap:10px}
  .tsearch{display:none}
  .topbar .newlbl{display:none}
  .topbar .btn.primary{padding:8px 11px;margin-left:auto}
  .content{padding:16px 14px 64px}
  .hero{padding:22px 20px}
  .hero h2{font-size:22px}
  .kpis,.tiles{gap:10px}
  .kpi{padding:14px}
  .kpi .num{font-size:26px}
  .kpi .ic{display:none}
  .fgrid{grid-template-columns:1fr}
  table{min-width:0}
  td .pill{white-space:normal;background:none;padding:0;align-items:baseline}
  td{padding:12px}
  th .th{padding:10px 12px}
  .frow{grid-template-columns:minmax(0,1fr) 112px}
  .toolbar .count{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

/* ---------- polish ---------- */
.panel,.kpi,.tile,.tablewrap,.beamcard{border-radius:18px}
.btn{border-radius:11px}
.btn.primary{background:linear-gradient(180deg,#4C8AF8,#3373F0);border-color:#3373F0;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 12px rgba(59,124,246,.32)}
.btn.primary:hover{background:linear-gradient(180deg,#3B7CF6,#2558C9);border-color:#2558C9}
.kpi .num{font-size:34px}
.kpi .lbl,.tile .lbl{letter-spacing:.005em}
.titlewrap{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#page-sub{font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:block;min-height:172px;padding:30px 32px;border:1px solid rgba(110,155,240,.18)}
.hero .copy{position:relative;z-index:1;max-width:620px}
.hero .acts{margin-top:20px}
.hero-art{position:absolute;right:36px;top:50%;transform:translateY(-50%);width:190px;height:190px;pointer-events:none}
.hero-art .glow{filter:blur(18px)}
.theme-ic-sun{display:none}
:root[data-theme="dark"] .theme-ic-sun{display:block}
:root[data-theme="dark"] .theme-ic-moon{display:none}
.logo-dark{display:none!important}
:root[data-theme="dark"] .logo-dark{display:block!important}
:root[data-theme="dark"] .logo-light-ui{display:none!important}
:root[data-theme="dark"] .side{border-right:1px solid var(--line)}
:root[data-theme="dark"] .avatar{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line)}
:root[data-theme="dark"] .empty .mark{filter:brightness(.95)}
:root[data-theme="dark"] .fbar.zero{background:var(--line-strong)}
@media (max-width:900px){ .hero-art{display:none} }
@media (max-width:640px){ #page-sub{display:none} .hero{min-height:0;padding:24px 20px} }
</style>

<div class="app" id="app">

        <label>Source<input id="f-source" list="dl-sources" autocomplete="off"></label>
        <label>Contact name<input id="f-contact" autocomplete="off"></label>
        <label>Contact role<input id="f-role" autocomplete="off"></label>
        <label>Email<input id="f-email" type="email" autocomplete="off"></label>
        <label>Website<input id="f-website" inputmode="url" autocomplete="off"></label>
        <label>Stage<select id="f-stage"></select></label>
        <label>Fit (1 weak, 5 strong)<select id="f-fit"></select></label>
        <label>Owner<select id="f-owner"></select></label>
        <div></div>
        <label class="span2">Next action<input id="f-next" autocomplete="off"></label>
        <label>Next action date<input id="f-date" type="date"></label>
        <div class="doneWrap"><button type="button" class="btn" id="btn-done">Done, set the next one</button></div>
        <label class="span2">Notes<textarea id="f-notes" rows="4"></textarea></label>
        <label class="span2">Log a note<input id="f-log" placeholder="e.g. Call with Sam, wants a quote for 200 samples" autocomplete="off"></label>
      </div>
      <h3>Activity</h3>
      <ol id="activity" class="activity"></ol>
    </div>
    <footer class="dr-foot">

      <span class="grow"></span>

<script src="config.js"></script>
<script>
(() => {
'use strict';

/* ---------- config & constants ---------- */
const CFG = Object.assign({
  appName: 'BD pipeline',
  owners: [],
  sources: ['AI research', 'Conference', 'LinkedIn', 'Inbound enquiry', 'Other'],
  firebase: null
}, window.CRM_CONFIG || {});

const STAGES = [
  { id: 'identified',   label: 'Identified',   color: '#B9CFFA' },
  { id: 'contacted',    label: 'Contacted',    color: '#8FB2F6' },
  { id: 'replied',      label: 'Replied',      color: '#6E9BF0' },
  { id: 'call',         label: 'Call booked',  color: '#4F86F4' },
  { id: 'requirements', label: 'Requirements', color: '#3B7CF6' },
  { id: 'quoted',       label: 'Quoted',       color: '#2558C9' },
  { id: 'won',          label: 'Won',          color: '#23794A' },
  { id: 'lost',         label: 'Lost',         color: '#9AA49E' }
];
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const isClosed = l => l.stage === 'won' || l.stage === 'lost';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
function weekEnd() { const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() + (6 - dow)); return ymd(d); }
const dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const dateTimeFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function bucket(l) {
  if (isClosed(l)) return 'closed';
  if (!l.nextDate) return 'none';
  const t = today();
  if (l.nextDate < t) return 'overdue';
  if (l.nextDate === t) return 'today';
  if (l.nextDate <= weekEnd()) return 'week';
  return 'later';
}
function fmtDue(l) {
  if (!l.nextDate) return '';
  const d = diffDays(l.nextDate, today());
  if (d < 0) return `Overdue ${-d}d`;
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  return dateFmt.format(parseYmd(l.nextDate));
}
function safeUrl(u) {
  if (!u) return '';
  try {
    const x = new URL(/^https?:\/\//i.test(u) ? u : 'https://' + u);
    return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : '';
  } catch { return ''; }
}

function blankLead() {
  const now = new Date().toISOString();
  return { id: uid(), company: '', group: '', contact: '', role: '', email: '', website: '', source: '', fit: 3,
           stage: 'identified', nextAction: '', nextDate: '', owner: '', notes: '', activity: [], created: now, updated: now };
}
function normalise(raw) {
  const b = blankLead();
  const l = Object.assign(b, raw || {});
  l.fit = Math.min(5, Math.max(1, parseInt(l.fit, 10) || 3));
  if (!STAGES.some(s => s.id === l.stage)) l.stage = 'identified';
  if (!Array.isArray(l.activity)) l.activity = [];
  ['company','group','contact','role','email','website','source','nextAction','nextDate','owner','notes'].forEach(k => { l[k] = l[k] == null ? '' : String(l[k]); });
  return l;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
}

/* ---------- stores ---------- */
function createLocalStore() {
  const KEY = 'astral-bd-crm-v1';
  let mem = null;               // fallback if localStorage is blocked
  let listener = null;
  const read = () => {
    if (mem) return mem;
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  };
  const write = arr => {
    if (mem) { mem = arr; return; }
    try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch { mem = arr; }
  };
  const emit = () => listener && listener(read());
  window.addEventListener('storage', e => { if (e.key === KEY) emit(); });
  return {
    mode: 'demo', user: '',
    subscribe(fn) { listener = fn; emit(); },
    async save(l) { const a = read().slice(); const i = a.findIndex(x => x.id === l.id); if (i >= 0) a[i] = l; else a.push(l); write(a); emit(); },
    async saveMany(ls) { const a = read().slice(); ls.forEach(l => { const i = a.findIndex(x => x.id === l.id); if (i >= 0) a[i] = l; else a.push(l); }); write(a); emit(); },
    async remove(id) { write(read().filter(x => x.id !== id)); emit(); },
    async removeMany(ids) { const s = new Set(ids); write(read().filter(x => !s.has(x.id))); emit(); }
  };
}

async function createFirebaseStore(cfg, onSignedIn, onSignedOut, onError) {
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [appM, authM, fsM] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  const db = fsM.getFirestore(app);
  const col = fsM.collection(db, 'leads');
  let unsub = null;
  const store = {
    mode: 'sync', user: '',
    subscribe(fn) {
      if (unsub) unsub();
      unsub = fsM.onSnapshot(col, snap => fn(snap.docs.map(d => d.data())), err => onError(err));
    },
    async save(l) { await fsM.setDoc(fsM.doc(db, 'leads', l.id), l); },
    async saveMany(ls) {
      for (let i = 0; i < ls.length; i += 400) {
        const b = fsM.writeBatch(db);
        ls.slice(i, i + 400).forEach(l => b.set(fsM.doc(db, 'leads', l.id), l));
        await b.commit();
      }
    },
    async remove(id) { await fsM.deleteDoc(fsM.doc(db, 'leads', id)); },
    async removeMany(ids) {
      for (let i = 0; i < ids.length; i += 400) {
        const b = fsM.writeBatch(db);
        ids.slice(i, i + 400).forEach(id => b.delete(fsM.doc(db, 'leads', id)));
        await b.commit();
      }
    },
    async signIn(email, pass) { await authM.signInWithEmailAndPassword(auth, email, pass); },
    async signOut() { if (unsub) { unsub(); unsub = null; } await authM.signOut(auth); }
  };
  authM.onAuthStateChanged(auth, user => {
    if (user) { store.user = user.email || 'You'; onSignedIn(store); }
    else { store.user = ''; onSignedOut(); }
  });
  return store;
}


/* ---------- state ---------- */
const VIEWS = { home: 'Home', leads: 'Leads', pipeline: 'Pipeline', followups: 'Follow-ups', analytics: 'Analytics' };
const state = { leads: [], view: 'home', stage: null, group: '', owner: '', q: '', sort: { k: 'company', dir: 1 }, editing: null, isNew: false };
let store = null;
let lastFocus = null;
const OPEN_STAGES = STAGES.filter(s => s.id !== 'won' && s.id !== 'lost');
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ---------- small helpers for the new views ---------- */
function weekStart(offsetWeeks = 0) { const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - dow + offsetWeeks * 7); return d; }
function initials(s) {
  s = String(s || '').trim(); if (!s) return '?';
  const base = s.includes('@') ? s.split('@')[0].replace(/[._-]+/g, ' ') : s;
  const parts = base.split(/\s+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function personName(s) {
  s = String(s || '').trim(); if (!s) return '';
  if (!s.includes('@')) return s;
  const first = s.split('@')[0].split(/[._-]+/)[0];
  const known = CFG.owners.find(o => o.toLowerCase() === first.toLowerCase());
  return known || (first.charAt(0).toUpperCase() + first.slice(1));
}
function rel(iso) {
  const t = new Date(iso).getTime(); if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hr ago`;
  const d = Math.round(h / 24); if (d < 7) return `${d} day${d === 1 ? '' : 's'} ago`;
  return dateFmt.format(new Date(t));
}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- filtering ---------- */
function matches(l, ignoreStage) {
  if (!ignoreStage && state.stage && l.stage !== state.stage) return false;
  if (state.group && l.group !== state.group) return false;
  if (state.owner && l.owner !== state.owner) return false;
  if (state.q) {
    const hay = [l.company, l.group, l.contact, l.role, l.email, l.nextAction, l.notes, l.owner].join(' ').toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t))) return false;
  }
  return true;
}

/* ---------- routing ---------- */
function routeFromHash() { const h = location.hash.replace('#', ''); return VIEWS[h] ? h : 'home'; }
function go(view) { if (location.hash !== '#' + view) location.hash = view; else { state.view = view; render(); } }

/* ---------- rendering ---------- */
function render() {
  const v = state.view;
  $('#page-title').textContent = VIEWS[v];
  const longDate = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  $('#page-sub').textContent = { home: longDate, leads: 'Everyone in the pipeline', pipeline: 'Drag a card to move it to another stage',
    followups: 'Overdue, today and the rest of the week', analytics: 'How the pipeline is moving' }[v];
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  renderBadges();
  const listView = v === 'leads' || v === 'pipeline' || v === 'followups';
  $('#toolbar').hidden = !listView || !state.leads.length;
  $('#beamcard').hidden = v !== 'leads' || !state.leads.length;
  if (listView) renderToolbar();
  if (v === 'leads') renderBeam();
  const host = $('#view');
  if (v === 'home') renderHome(host);
  else if (v === 'analytics') renderAnalytics(host);
  else if (!state.leads.length) host.innerHTML = emptyHtml();
  else {
    const list = state.leads.filter(l => matches(l));
    $('#count').textContent = plural(list.length, 'lead');
    if (v === 'leads') host.innerHTML = list.length ? tableHtml(sortLeads(list, state.sort.k, state.sort.dir), true) : noMatchHtml();
    else if (v === 'pipeline') renderBoard(host, list);
    else renderDue(host, list);
  }
}

function renderBadges() {
  const open = state.leads.filter(l => !isClosed(l));
  const over = open.filter(l => bucket(l) === 'overdue').length;
  const nb = $('#nb-over'); nb.hidden = !over; nb.textContent = over;
  const nl = $('#nb-leads'); nl.hidden = !open.length; nl.textContent = open.length;
}

function renderBeam() {
  const counts = {};
  STAGES.forEach(st => counts[st.id] = 0);
  state.leads.filter(l => matches(l, true)).forEach(l => { counts[l.stage]++; });
  $('#beam').innerHTML = STAGES.map(st =>
    `<button type="button" class="stage ${counts[st.id] ? 'has' : 'zero'}" style="--c:${st.color}" data-stage="${st.id}" aria-pressed="${state.stage === st.id}" aria-label="${esc(st.label)}: ${plural(counts[st.id], 'lead')}">` +
    `<span class="n">${counts[st.id]}</span><span class="l">${esc(st.label)}</span><span class="dot" aria-hidden="true"></span></button>`).join('');
}

function renderToolbar() {
  const groups = [...new Set(state.leads.map(l => l.group).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  if (state.group && !groups.includes(state.group)) state.group = '';
  const owners = [...new Set([...CFG.owners, ...state.leads.map(l => l.owner).filter(Boolean)])];
  if (state.owner && !owners.includes(state.owner)) state.owner = '';
  $('#flt-group').innerHTML = '<option value="">All customer groups</option>' + groups.map(g => `<option value="${esc(g)}"${g === state.group ? ' selected' : ''}>${esc(g)}</option>`).join('');
  $('#flt-owner').innerHTML = '<option value="">All owners</option>' + owners.map(o => `<option value="${esc(o)}"${o === state.owner ? ' selected' : ''}>${esc(o)}</option>`).join('');
  $('#btn-clear').hidden = !(state.stage || state.group || state.owner || state.q);
  $('#dl-groups').innerHTML = groups.map(g => `<option value="${esc(g)}">`).join('');
  if ($('#q').value !== state.q) $('#q').value = state.q;
  if ($('#tq').value !== state.q) $('#tq').value = state.q;
}

function fitHtml(n) {
  return `<span class="fit" role="img" aria-label="Fit ${n} of 5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
}
const pillHtml = l => { const st = stageOf(l.stage); return `<span class="pill"><i style="background:${st.color}"></i>${esc(st.label)}</span>`; };
const ownerHtml = o => o ? `<span class="owner"><i aria-hidden="true">${esc(initials(o))}</i>${esc(o)}</span>` : '<span class="muted">Unassigned</span>';

const COLS = [
  { k: 'company', t: 'Company', w: '25%' }, { k: 'group', t: 'Customer group', cls: 'hide-sm', w: '15%' }, { k: 'stage', t: 'Stage', w: '14%' },
  { k: 'fit', t: 'Fit', cls: 'hide-sm', w: '8%' }, { k: 'next', t: 'Next action', w: '23%' }, { k: 'owner', t: 'Owner', cls: 'hide-sm', w: '15%' }
];

function rowHtml(l) {
  const b = bucket(l);
  return `<tr data-id="${esc(l.id)}">` +
    `<td><button type="button" class="co" data-open="${esc(l.id)}">${esc(l.company || '(no name)')}</button>` +
      (l.contact ? `<div class="sub">${esc(l.contact)}${l.role ? ', ' + esc(l.role) : ''}</div>` : '') + `</td>` +
    `<td class="hide-sm">${esc(l.group)}</td>` +
    `<td>${pillHtml(l)}</td>` +
    `<td class="hide-sm">${fitHtml(l.fit)}</td>` +
    `<td>${l.nextAction ? esc(l.nextAction) : '<span class="muted">Not set</span>'}` +
      (l.nextDate ? `<div class="due ${b}">${esc(fmtDue(l))}</div>` : '') + `</td>` +
    `<td class="hide-sm">${ownerHtml(l.owner)}</td></tr>`;
}

function sortLeads(list, k, dir) {
  const cmp = {
    company: (a, b) => a.company.localeCompare(b.company),
    group: (a, b) => a.group.localeCompare(b.group),
    stage: (a, b) => STAGES.findIndex(s => s.id === a.stage) - STAGES.findIndex(s => s.id === b.stage),
    fit: (a, b) => a.fit - b.fit,
    owner: (a, b) => a.owner.localeCompare(b.owner),
    next: (a, b) => (a.nextDate || '9999') < (b.nextDate || '9999') ? -1 : (a.nextDate || '9999') > (b.nextDate || '9999') ? 1 : 0
  }[k];
  return list.slice().sort((a, b) => cmp(a, b) * dir || a.company.localeCompare(b.company));
}

function tableHtml(list, sortable) {
  const cols = COLS.map(c => `<col style="width:${c.w}" class="${c.cls || ''}">`).join('');
  const head = COLS.map(c => {
    const sorted = sortable && state.sort.k === c.k;
    const aria = sorted ? (state.sort.dir === 1 ? 'ascending' : 'descending') : 'none';
    return `<th class="${c.cls || ''}" aria-sort="${aria}">` + (sortable ? `<button type="button" class="th" data-sort="${c.k}">${c.t}</button>` : `<span class="th">${c.t}</span>`) + `</th>`;
  }).join('');
  return `<div class="tablewrap"><table><colgroup>${cols}</colgroup><thead><tr>${head}</tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table></div>`;
}

function topCounts(values, n) {
  const m = new Map();
  values.forEach(v => m.set(v, (m.get(v) || 0) + 1));
  let rows = [...m.entries()].map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value || a.label.localeCompare(b.label));
  if (rows.length > n) {
    const rest = rows.slice(n - 1).reduce((s, r) => s + r.value, 0);
    rows = rows.slice(0, n - 1).concat({ label: 'Other', value: rest });
  }
  return rows;
}
function barsHtml(rows) {
  if (!rows.length) return '<div class="pempty">No data yet.</div>';
  const max = Math.max(1, ...rows.map(r => r.value));
  return `<div class="bars">` + rows.map(r =>
    `<div class="brow" data-tip="${esc(r.label)}: ${plural(r.value, 'lead')}" tabindex="0">
      <span class="bl">${r.dot ? `<i style="background:${r.dot}"></i>` : ''}<span>${esc(r.label)}</span></span>
      <div class="track"><div class="fill" style="width:${r.value ? r.value / max * 100 : 0}%"></div></div>
      <span class="bv">${r.value}</span></div>`).join('') + `</div>`;
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delim = (firstLine.split('\t').length > firstLine.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
const HMAP = {
  company: ['company', 'companyname', 'organisation', 'organization', 'account'],
  group: ['customergroup', 'group', 'segment', 'sector', 'category', 'industry'],
  contact: ['contactname', 'contact', 'person', 'keycontact'],
  role: ['contactrole', 'role', 'title', 'jobtitle', 'position'],
  email: ['email', 'emailaddress', 'contactemail'],
  website: ['website', 'url', 'web', 'site', 'companywebsite'],
  source: ['source', 'leadsource'],
  fit: ['fit', 'fitscore', 'fit15', 'score'],
  stage: ['stage', 'status'],
  owner: ['owner'],
  nextAction: ['nextaction'],
  nextDate: ['nextactiondate', 'nextdate', 'due', 'duedate'],
  notes: ['notes', 'note', 'reason', 'why', 'rationale', 'comments']
};
function parseDateCell(v) {
  v = String(v || '').trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);       // UK day/month/year
  if (m) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return '';
}
function rowsToLeads(rows) {
  const header = rows[0].map(h => String(h).toLowerCase().replace(/[^a-z0-9]/g, ''));
  const idx = {};
  Object.keys(HMAP).forEach(k => { const i = header.findIndex(h => HMAP[k].includes(h)); if (i >= 0) idx[k] = i; });
  if (idx.company == null) return null;
  const get = (r, k) => idx[k] == null ? '' : String(r[idx[k]] == null ? '' : r[idx[k]]).trim();
  const now = new Date().toISOString();
  return rows.slice(1).map(r => {
    const l = blankLead();
    l.company = get(r, 'company'); l.group = get(r, 'group'); l.contact = get(r, 'contact'); l.role = get(r, 'role');
    l.email = get(r, 'email'); l.website = get(r, 'website'); l.source = get(r, 'source') || 'Import';
    l.owner = get(r, 'owner'); l.nextAction = get(r, 'nextAction'); l.nextDate = parseDateCell(get(r, 'nextDate'));
    l.notes = get(r, 'notes');
    const fit = parseInt(get(r, 'fit'), 10); l.fit = fit >= 1 && fit <= 5 ? fit : 3;
    const st = get(r, 'stage').toLowerCase(); const hit = STAGES.find(s => s.label.toLowerCase() === st || s.id === st);
    l.stage = hit ? hit.id : 'identified';
    l.activity = [{ at: now, by: who(), text: 'Imported from CSV' }];
    return l;
  }).filter(l => l.company);
}
const dupKey = l => (l.company + '|' + (l.email || l.contact)).toLowerCase().trim();

async function importFile(file) {
  if (!store) { toast('Sign in first'); return; }
  const text = await file.text();
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('That file has no rows to import'); return; }
  const leads = rowsToLeads(rows);
  if (!leads) { toast('No Company column found. Download the CSV template to see the expected columns.'); return; }
  const have = new Set(state.leads.map(dupKey));
  const fresh = [];
  let skipped = 0;
  leads.forEach(l => { const k = dupKey(l); if (have.has(k)) skipped++; else { have.add(k); fresh.push(l); } });
  if (!fresh.length) { toast(`Nothing new to import (${skipped} already in the pipeline)`); return; }
  try {
    await store.saveMany(fresh);
    toast(`Imported ${fresh.length} lead${fresh.length === 1 ? '' : 's'}` + (skipped ? `, skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}` : ''));
  } catch (err) { toast('Import failed: ' + (err.message || err)); }
}

const csvCell = v => {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;               // stop spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function download(name, text) {
  const url = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

         nextAction: 'Follow up on irradiation quote', nextDate: addDays(5), owner: owner2, notes: demo + 'Breeding blanket and fusion plant technology supplier.' }, 44),
    mk({ company: 'First Light Fusion', group: 'Fusion developers', role: 'Head of engineering (target role)', source: 'Example', stage: 'replied', fit: 4,
         nextAction: 'Book intro call', nextDate: addDays(1), owner, notes: demo + 'Oxford-based inertial fusion company.' }, 9),
    mk({ company: 'Proxima Fusion', group: 'Fusion developers', role: 'Materials engineer (target role)', source: 'Example', stage: 'identified', fit: 3,
         notes: demo + 'German stellarator developer. Check appetite for UK testing.' }, 4),
    mk({ company: 'Commonwealth Fusion Systems', group: 'Fusion developers', role: 'Radiation effects lead (target role)', source: 'Example', stage: 'identified', fit: 3,
         notes: demo + 'US tokamak developer. Longer shot, but a large testing programme.' }, 2),
    mk({ company: 'Frazer-Nash Consultancy', group: 'Fusion supply chain', role: 'Fusion business lead (target role)', source: 'Example', stage: 'contacted', fit: 3,
         nextAction: 'Send overview deck', nextDate: addDays(3), owner: owner2, notes: demo + 'UK engineering consultancy working on fusion programmes. Possible channel partner.' }, 12),
    mk({ company: 'University of Birmingham', group: 'Research & national labs', role: 'Nuclear materials research group (target)', source: 'Example', stage: 'won', fit: 4,
         owner, notes: demo + 'University nuclear materials research. Shown as won for the demo.' }, 60),
    mk({ company: 'Gauss Fusion', group: 'Fusion developers', role: 'Procurement (target role)', source: 'Example', stage: 'lost', fit: 2,
         owner: owner2, notes: demo + 'European industrial fusion consortium. Shown as lost for the demo.' }, 50)
  ]);
  toast('Example leads added. Remove them from your account menu when you are done.');
}
async function clearExamples() {
  if (!store) return;
  const ids = state.leads.filter(l => l.source === 'Example').map(l => l.id);
  if (!ids.length) { toast('No example leads to remove'); return; }
  await store.removeMany(ids);
  toast(`Removed ${plural(ids.length, 'example lead')}`);
}

/* ---------- wiring ---------- */
function resetFilters() { state.stage = null; state.group = ''; state.owner = ''; state.q = ''; $('#q').value = ''; $('#tq').value = ''; render(); }
function closeUserMenu() { $('#user').open = false; }
function setNav(open) { $('#app').classList.toggle('navopen', open); }

function bindUI() {
  fillSelects();

  // theme toggle (follows the system until chosen, then remembered)
  const syncThemeBtn = () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark'; const lbl = dark ? 'Switch to light theme' : 'Switch to dark theme'; $('#btn-theme').setAttribute('aria-label', lbl); $('#btn-theme').title = lbl; };
  syncThemeBtn();
  $('#btn-theme').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('astral-bd-theme', next); } catch {}
    syncThemeBtn();
  });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    let saved = null; try { saved = localStorage.getItem('astral-bd-theme'); } catch {}
    if (saved !== 'light' && saved !== 'dark') { document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light'); syncThemeBtn(); }
  });

  // sidebar collapse (remembered per browser)
  try { if (localStorage.getItem('astral-bd-collapsed') === '1') $('#app').classList.add('collapsed'); } catch {}
  $('#btn-collapse').addEventListener('click', () => {
    const c = $('#app').classList.toggle('collapsed');
    $('#btn-collapse').setAttribute('aria-label', c ? 'Expand menu' : 'Collapse menu');
    $('#btn-collapse').title = c ? 'Expand menu' : 'Collapse menu';
    try { localStorage.setItem('astral-bd-collapsed', c ? '1' : '0'); } catch {}
  });
  $('#btn-menu').addEventListener('click', () => setNav(true));
  $('#navscrim').addEventListener('click', () => setNav(false));
  document.querySelectorAll('[data-nav]').forEach(a => a.addEventListener('click', () => setNav(false)));

  window.addEventListener('hashchange', () => { state.view = routeFromHash(); render(); window.scrollTo(0, 0); });

  $('#beam').addEventListener('click', e => {
    const b = e.target.closest('[data-stage]'); if (!b) return;
    state.stage = state.stage === b.dataset.stage ? null : b.dataset.stage;
    render();
  });
  const onSearch = v => { state.q = v; if (!['leads', 'pipeline', 'followups'].includes(state.view) && v) go('leads'); else render(); };
  $('#q').addEventListener('input', e => onSearch(e.target.value));
  $('#tq').addEventListener('input', e => onSearch(e.target.value));
  $('#flt-group').addEventListener('change', e => { state.group = e.target.value; render(); });
  $('#flt-owner').addEventListener('change', e => { state.owner = e.target.value; render(); });
  $('#btn-clear').addEventListener('click', resetFilters);

  $('#view').addEventListener('click', e => {
    const sortBtn = e.target.closest('[data-sort]');
    if (sortBtn) { const k = sortBtn.dataset.sort; state.sort = { k, dir: state.sort.k === k ? -state.sort.dir : 1 }; render(); return; }
    const g = e.target.closest('[data-go]');
    if (g) { state.stage = g.dataset.stageGo || null; go(g.dataset.go); return; }
    const act = e.target.closest('[data-act]');
    if (act) {
      ({ new: () => openDrawer(null), import: () => $('#file').click(), template: downloadTemplate,
         examples: loadExamples, clear: resetFilters }[act.dataset.act] || (() => {}))();
      return;
    }
    const open = e.target.closest('[data-open]');
    const tr = e.target.closest('tr[data-id]');
    const id = open ? open.dataset.open : tr ? tr.dataset.id : null;
    if (id) openDrawer(id);
  });

  /* drag and drop on the board */
  const view = $('#view');
  let dragId = null;
  view.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  view.addEventListener('dragend', e => { const c = e.target.closest('.card'); if (c) c.classList.remove('dragging'); view.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
  view.addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); view.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); col.classList.add('over'); });
  view.addEventListener('drop', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; changeStage(id, col.dataset.stage); });

  /* hover / focus tooltips for charts */
  const tip = $('#tip');
  const showTip = (el, x, y) => { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x - r.width / 2)) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px'; };
  view.addEventListener('mousemove', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
  view.addEventListener('mouseleave', () => { tip.hidden = true; });
  view.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } });
  view.addEventListener('focusout', () => { tip.hidden = true; });

  $('#btn-new').addEventListener('click', () => openDrawer(null));
  $('#btn-import').addEventListener('click', () => { setNav(false); $('#file').click(); });
  $('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
  $('#btn-export').addEventListener('click', () => { setNav(false); exportCSV(); });
  $('#m-template').addEventListener('click', () => { setNav(false); downloadTemplate(); });
  $('#m-examples').addEventListener('click', () => { closeUserMenu(); loadExamples(); });
  $('#m-clear').addEventListener('click', () => { closeUserMenu(); clearExamples(); });
  $('#m-signout').addEventListener('click', async () => { closeUserMenu(); if (store && store.signOut) await store.signOut(); });
  document.addEventListener('click', e => { const m = $('#user'); if (m.open && !m.contains(e.target)) m.open = false; });

  $('#lead-form').addEventListener('submit', saveForm);
  $('#dr-close').addEventListener('click', closeDrawer);
  $('#dr-cancel').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);
  $('#btn-delete').addEventListener('click', deleteLead);
  $('#btn-done').addEventListener('click', () => {
    const cur = $('#f-next').value.trim();
    if (cur && !$('#f-log').value.trim()) $('#f-log').value = 'Done: ' + cur;
    $('#f-next').value = ''; $('#f-date').value = ''; $('#f-next').focus();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#drawer').classList.contains('open')) closeDrawer();
    else if ($('#app').classList.contains('navopen')) setNav(false);
    else if ($('#user').open) closeUserMenu();
  });

  /* keep Tab inside the open drawer */
  $('#drawer').addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...$('#drawer').querySelectorAll('input,select,textarea,button,a[href]')].filter(x => !x.hidden && !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

function setBanner(text, warn) { const b = $('#banner'); b.textContent = text; b.hidden = !text; b.classList.toggle('warn', !!warn); }
function setStatus(live, title, sub) { $('#status').classList.toggle('live', live); $('#status-t').textContent = title; $('#status-s').textContent = sub; }
function setUser(email) {
  const name = email ? personName(email) : 'Demo user';
  $('#avatar').textContent = email ? initials(name) : 'D';
  $('#u-name').textContent = name;
  $('#u-mail').textContent = email || 'Demo mode, saved in this browser';
  $('#m-signout').hidden = !email; $('#m-sep').hidden = !email;
}
function onData(arr) { state.leads = arr.map(normalise); render(); }

async function start() {
  state.view = routeFromHash();
  bindUI();
  render();
  if (!CFG.firebase) {
    store = createLocalStore();
    setStatus(false, 'Demo mode', 'Saved in this browser');
    setUser('');
    setBanner('Demo mode: leads are saved in this browser only. Add your Firebase details in config.js to share the pipeline with the team.');
    store.subscribe(onData);
    return;
  }
  setStatus(false, 'Connecting', 'Firebase');
  setUser('');
  const dlg = $('#signin');
  let pending = null;
  $('#signin-form').addEventListener('submit', async e => {
    e.preventDefault();
    $('#si-err').textContent = '';
    if (!pending) { $('#si-err').textContent = 'Still connecting. Try again in a moment.'; return; }
    try { await pending.signIn($('#si-email').value.trim(), $('#si-pass').value); }
    catch (err) { $('#si-err').textContent = 'Could not sign in. Check the email and password, or ask for an account to be added.'; }
  });
  try {
    pending = await createFirebaseStore(CFG.firebase,
      s => {
        store = s;
        setStatus(true, 'Live', 'Synced with the team');
        setUser(s.user);
        setBanner('');
        if (dlg.open) dlg.close();
        $('#si-pass').value = '';
        s.subscribe(onData);
      },
      () => {
        store = null; state.leads = []; render();
        setStatus(false, 'Signed out', 'Sign in to see leads');
        setUser('');
        if (!dlg.open) dlg.showModal();
      },
      err => {
        const denied = err && err.code === 'permission-denied';
        setBanner(denied ? 'This account is not on the access list for the pipeline. Ask an admin to add your email to the Firestore rules, then sign in again.' : 'Could not load leads: ' + (err.message || err), true);
      });
  } catch (err) {
    setStatus(false, 'Offline', 'Could not reach Firebase');
    setBanner('Could not reach Firebase. Check your connection and the config in config.js, then reload.', true);
  }
}

start();
})();
</script>
